<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#12071c" />
<title>앵그리 피크 · 피크 던지기</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#08030d;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  #wrap{position:fixed;inset:0;overflow:hidden;background:#08030d;}
  canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

  /* ---------------- HUD ---------------- */
  #hud{
    position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
    padding:calc(9px + env(safe-area-inset-top)) calc(11px + env(safe-area-inset-right))
            calc(9px + env(safe-area-inset-bottom)) calc(11px + env(safe-area-inset-left));
  }
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .chip{
    display:flex;flex-direction:column;gap:1px;padding:7px 12px 8px;border-radius:13px;
    background:linear-gradient(180deg,rgba(40,10,52,.74),rgba(14,4,20,.62));
    border:1px solid rgba(255,110,190,.26);
    box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.09);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  .chip em{font-style:normal;font-size:9.5px;letter-spacing:.2em;font-weight:800;color:#ff89c6}
  .chip span{font-size:13px;font-weight:800;letter-spacing:-.02em;color:#fff;opacity:.94}
  .score{
    margin-top:2px;display:flex;align-items:baseline;gap:3px;padding:6px 11px 7px;border-radius:12px;
    background:linear-gradient(180deg,rgba(40,10,52,.6),rgba(14,4,20,.5));
    border:1px solid rgba(120,220,255,.2);box-shadow:0 8px 22px rgba(0,0,0,.4);
  }
  .score b{font-size:16px;font-weight:900;letter-spacing:.01em;
    background:linear-gradient(180deg,#fff,#9fe6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .score i{font-style:normal;font-size:9px;font-weight:800;color:#7fd6ff;opacity:.8}
  .hdbtns{display:flex;gap:7px;pointer-events:auto}
  .ibtn{
    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:16px;line-height:1;
    color:#ffd9ee;background:linear-gradient(180deg,rgba(40,10,52,.72),rgba(14,4,20,.62));
    border:1px solid rgba(255,110,190,.24);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer;
    transition:transform .12s ease,background .2s;font-family:inherit;padding:0;
  }
  .ibtn:active{transform:scale(.92)}
  .ibtn.off{opacity:.45}

  .botbar{display:flex;flex-direction:column;align-items:center;gap:7px;}
  .pickrow{
    display:flex;gap:7px;align-items:center;justify-content:center;min-height:22px;
    padding:5px 11px 6px;border-radius:20px;background:rgba(16,4,24,.5);
    border:1px solid rgba(255,110,190,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .pk{width:17px;height:20px;background:linear-gradient(160deg,#ffffff,#f4f7fd 48%,#d3dcea 100%);
    clip-path:polygon(50% 100%,2% 42%,16% 10%,50% 0%,84% 10%,98% 42%);
    filter:drop-shadow(0 0 6px rgba(255,248,226,.85)) drop-shadow(0 0 1.2px rgba(58,68,86,.9));transition:opacity .3s,transform .3s}
  .pk.spent{opacity:.15;filter:none;transform:scale(.8)}
  .lbl{font-size:9px;letter-spacing:.18em;color:#ff9ed0;font-weight:800;opacity:.8}
  .botbar{gap:6px}
  .hint{
    font-size:12.5px;font-weight:700;color:#ffe6f4;letter-spacing:-.01em;
    padding:6px 13px;border-radius:20px;background:rgba(18,5,26,.55);
    border:1px solid rgba(255,110,190,.2);opacity:0;transform:translateY(6px);
    transition:opacity .45s,transform .45s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .hint.show{opacity:1;transform:translateY(0)}

  /* ---------------- overlays ---------------- */
  .ov{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;
    background:radial-gradient(120% 80% at 50% 40%,rgba(24,6,34,.55),rgba(6,2,10,.86));
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    opacity:0;pointer-events:none;transition:opacity .38s ease;z-index:5;
    overflow:auto;padding:12px;touch-action:pan-y;
  }
  .ov.show{opacity:1;pointer-events:auto}
  .card{
    width:min(88vw,392px);padding:24px 20px 22px;border-radius:24px;text-align:center;
    background:linear-gradient(180deg,rgba(46,12,60,.93),rgba(14,4,22,.96));
    border:1px solid rgba(255,110,190,.24);
    box-shadow:0 30px 80px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.09);
    transform:translateY(14px) scale(.97);transition:transform .42s cubic-bezier(.2,1.2,.3,1);
    max-height:calc(100vh - 26px);max-height:calc(100dvh - 26px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  }
  .ov.show .card{transform:translateY(0) scale(1)}
  .kicker{font-size:9.5px;letter-spacing:.28em;font-weight:800;color:#ff89c6;opacity:.9;margin-bottom:9px}
  h1{
    margin:0;font-size:44px;line-height:.98;font-weight:900;letter-spacing:-.05em;
    background:linear-gradient(180deg,#fff 10%,#ffb3e0 55%,#ff4fa8 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 22px rgba(255,60,150,.45));
  }
  h1 span{display:block;font-size:.78em;letter-spacing:.02em;color:#fff}
  .sub{margin:13px 0 0;font-size:13.5px;line-height:1.6;color:#e9d6f0;opacity:.88;font-weight:600}
  .how{display:flex;flex-direction:column;gap:7px;margin:17px 0 4px;text-align:left}
  .how div{
    display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:#f0dcf6;opacity:.9;
    padding:9px 12px;border-radius:11px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06)
  }
  .how b{
    flex:0 0 20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;
    background:linear-gradient(180deg,#ff6bb8,#c02c86);color:#fff;box-shadow:0 0 12px rgba(255,70,150,.55)
  }
  .btn{
    display:block;width:100%;margin-top:17px;padding:14px 18px;border:0;border-radius:15px;
    font-family:inherit;font-size:15.5px;font-weight:900;letter-spacing:-.01em;color:#2a0018;cursor:pointer;
    background:linear-gradient(180deg,#ffd0e8,#ff7ac1 55%,#ff3f9e);
    box-shadow:0 12px 30px rgba(255,50,140,.38),inset 0 1px 0 rgba(255,255,255,.7);
    transition:transform .12s ease,filter .2s;
  }
  .btn:active{transform:translateY(1px) scale(.985);filter:brightness(.96)}
  .btn.ghost{
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    color:#ffd9ee;border:1px solid rgba(255,110,190,.3);box-shadow:none;margin-top:9px;font-size:13.5px;padding:12px
  }
  .stars{display:flex;justify-content:center;gap:10px;margin:6px 0 2px}
  .st{width:44px;height:44px;filter:grayscale(1) brightness(.5);opacity:.5;transition:transform .35s,filter .35s,opacity .35s}
  .st.on{filter:drop-shadow(0 0 14px rgba(255,200,90,.85));opacity:1;transform:scale(1.06) translateY(-2px)}
  .pt{margin-top:8px;font-size:26px;font-weight:900;letter-spacing:-.02em;
    background:linear-gradient(180deg,#fff,#ffe6a8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .pt small{font-size:12px;color:#ffd98a;-webkit-text-fill-color:#ffd98a;margin-left:3px;font-weight:800}
  .ttl{margin:0;font-size:30px;font-weight:900;letter-spacing:-.04em;
    background:linear-gradient(180deg,#fff,#ffc6e6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .fin{display:flex;gap:8px;justify-content:center;margin:14px 0 0}
  .fin div{flex:1;padding:9px 4px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
  .fin b{display:block;font-size:17px;font-weight:900;color:#ffe0f0}
  .fin i{font-style:normal;font-size:9px;letter-spacing:.12em;color:#ff9ed0;font-weight:800}
  .credit{margin-top:12px;font-size:10px;letter-spacing:.04em;color:#c9a2d8;opacity:.6}

  @media (max-height:540px){
    h1{font-size:31px}
    .card{padding:15px 16px 14px;border-radius:18px}
    .kicker{margin-bottom:5px;font-size:8.5px}
    .sub{font-size:12px;margin-top:7px;line-height:1.45}
    .how{margin:9px 0 2px;gap:5px}
    .how div{padding:6px 10px;font-size:11.5px;border-radius:9px}
    .how b{width:17px;height:17px;flex:0 0 17px;font-size:9.5px}
    .btn{margin-top:10px;padding:11px 16px;font-size:14px;border-radius:12px}
    .credit{display:none}
    .st{width:33px;height:33px}
    .pt{font-size:21px}
    .ttl{font-size:23px}
    .stars{gap:6px;margin:3px 0 0}
    .fin{margin-top:9px}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="topbar">
      <div class="chip"><em id="stageNum">STAGE 1</em><span id="stageName">사운드 체크</span></div>
      <div style="display:flex;gap:7px;align-items:flex-start">
        <div class="score"><b id="scoreVal">0</b><i>PT</i></div>
        <div class="hdbtns">
          <button class="ibtn" id="btnSound" aria-label="소리 켜기/끄기">♪</button>
          <button class="ibtn" id="btnRetry" aria-label="다시 하기">↺</button>
        </div>
      </div>
    </div>
    <div class="botbar">
      <div class="lbl" id="pickLbl">남은 피크</div>
      <div class="pickrow" id="pickRow"></div>
      <div class="hint" id="hintEl">피크를 뒤로 당겼다 놓아라!</div>
    </div>
  </div>

  <div class="ov show" id="ovTitle">
    <div class="card">
      <div class="kicker">AFTER SHOW · PICK THROW</div>
      <h1>앵그리<span>피크</span></h1>
      <p class="sub">공연이 끝난 무대.<br>관객에게 피크를 던져라!</p>
      <div class="how">
        <div><b>1</b> 피크를 뒤로 당기고</div>
        <div><b>2</b> 점선 궤적을 확인하고</div>
        <div><b>3</b> 놓아서 팬 존에 꽂아라</div>
      </div>
      <button class="btn" id="btnStart">무대 오르기</button>
      <div class="credit">다롱 님의 그림으로 만든 게임</div>
    </div>
  </div>

  <div class="ov" id="ovClear">
    <div class="card">
      <div class="kicker" id="clearKicker">STAGE 1 CLEAR</div>
      <div class="stars">
        <svg class="st" id="st0" viewBox="0 0 24 24"><path d="M12 2.4l2.9 6.1 6.7.9-4.9 4.6 1.2 6.6L12 17.4 6.1 20.6l1.2-6.6L2.4 9.4l6.7-.9z" fill="#ffd257"/></svg>
        <svg class="st" id="st1" viewBox="0 0 24 24"><path d="M12 2.4l2.9 6.1 6.7.9-4.9 4.6 1.2 6.6L12 17.4 6.1 20.6l1.2-6.6L2.4 9.4l6.7-.9z" fill="#ffd257"/></svg>
        <svg class="st" id="st2" viewBox="0 0 24 24"><path d="M12 2.4l2.9 6.1 6.7.9-4.9 4.6 1.2 6.6L12 17.4 6.1 20.6l1.2-6.6L2.4 9.4l6.7-.9z" fill="#ffd257"/></svg>
      </div>
      <p class="sub" id="clearMsg">관객이 피크를 받았다!</p>
      <div class="pt"><span id="clearPt">0</span><small>PT</small></div>
      <button class="btn" id="btnNext">다음 무대</button>
    </div>
  </div>

  <div class="ov" id="ovFail">
    <div class="card">
      <div class="kicker">OUT OF PICKS</div>
      <p class="ttl">피크를 다 썼어…</p>
      <p class="sub" id="failMsg">궤적을 다시 보고 던져봐!</p>
      <button class="btn" id="btnRetry2">다시 도전</button>
    </div>
  </div>

  <div class="ov" id="ovDone">
    <div class="card">
      <div class="kicker">SHOW COMPLETE</div>
      <p class="ttl">앵콜 성공! 🎸</p>
      <p class="sub">세 개의 무대를 모두 클리어했어.</p>
      <div class="fin">
        <div><b id="finScore">0</b><i>SCORE</i></div>
        <div><b id="finStars">0</b><i>STARS</i></div>
      </div>
      <button class="btn" id="btnAgain">처음부터</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   앵그리 피크 — single-file canvas game
   ===================================================================== */
window.__err = [];
window.addEventListener('error', function (e) {
  window.__err.push(String(e.message) + ' @' + (e.filename || '') + ':' + e.lineno);
});

/* =====================================================================
   1. MODEL — pure physics + stage layout (no DOM access)
   ===================================================================== */
var MODEL = (function () {
  'use strict';
  var TAU = Math.PI * 2;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function makeEnv(W, H) {
    var S = Math.min(W, H);
    var g = 3.0 * S;
    var maxDrag = 0.28 * S;
    var vmax = 3.25 * S;
    return {
      W: W, H: H, S: S,
      floorY: H * 0.855,
      g: g,
      airDrag: 0.22,
      maxDrag: maxDrag,
      vmax: vmax,
      k: vmax / maxDrag,
      pickR: Math.max(6.5, 0.0245 * S)
    };
  }

  /* circle vs axis-aligned rect -> {nx, ny, pen} or null */
  function circleRect(cx, cy, r, rc) {
    var nx = clamp(cx, rc.x, rc.x + rc.w);
    var ny = clamp(cy, rc.y, rc.y + rc.h);
    var dx = cx - nx, dy = cy - ny;
    var d2 = dx * dx + dy * dy;
    if (d2 > r * r) return null;
    var d = Math.sqrt(d2);
    if (d > 1e-6) return { nx: dx / d, ny: dy / d, pen: r - d };
    var l = cx - rc.x, rt = rc.x + rc.w - cx, tp = cy - rc.y, bt = rc.y + rc.h - cy;
    var m = Math.min(l, rt, tp, bt);
    if (m === l) return { nx: -1, ny: 0, pen: r + l };
    if (m === rt) return { nx: 1, ny: 0, pen: r + rt };
    if (m === tp) return { nx: 0, ny: -1, pen: r + tp };
    return { nx: 0, ny: 1, pen: r + bt };
  }

  function solid(x, y, w, h, kind, rest) {
    return { x: x, y: y, w: w, h: h, kind: kind, solid: true, rest: (rest === undefined ? 0.5 : rest) };
  }
  function decor(x, y, w, h, kind) {
    return { x: x, y: y, w: w, h: h, kind: kind, solid: false, rest: 0 };
  }

  function buildStage(index, env) {
    var W = env.W, H = env.H, S = env.S, gy = env.floorY;
    /* the sprite: 667x760 png, picking hand at (0.3433, 0.8724) of the image */
    var SPR_ASPECT = 0.8776;
    var HAND_NX = 0.3433, HAND_NY = 0.8724;
    var charH = Math.min(S * 0.60, H * 0.42);
    var charW = charH * SPR_ASPECT;
    var charCx = Math.max(W * 0.22, charW * 0.5 + S * 0.03);
    var charBaseY = gy - H * 0.035;
    var ax = charCx - charW * 0.5 + HAND_NX * charW;
    var ay = charBaseY - charH + HAND_NY * charH - charH * 0.012;

    var st = {
      index: index,
      name: '', sub: '',
      charCx: charCx, charBaseY: charBaseY, charW: charW, charH: charH,
      anchor: { x: ax, y: ay },
      obstacles: [],
      goal: null,
      picksLeft: 3,
      windAmp: 0,
      stars: 3
    };

    if (index === 0) {
      st.name = '사운드 체크';
      st.sub = '스테이지 모니터 위 팬 존에 피크를!';
      st.picksLeft = 3;

      var GX = W * 0.735;
      var mw = Math.min(S * 0.21, W * 0.24), mh = S * 0.105;
      var gw = Math.min(S * 0.155, W * 0.17), gh = S * 0.10;

      st.goal = { x: GX - gw / 2, y: gy - mh - gh, w: gw, h: gh, kind: 'fan', label: 'FAN ZONE' };
      st.obstacles.push(solid(GX - mw / 2, gy - mh, mw, mh, 'monitor', 0.45));
      /* decor */
      st.obstacles.push(decor(GX - mw * 0.75, gy - S * 0.045, S * 0.026, S * 0.045, 'bottle'));
      st.obstacles.push(decor(ax + S * 0.02, gy - S * 0.012, S * 0.06, S * 0.012, 'cable'));
      st.obstacles.push(decor(W * 0.47, gy - S * 0.014, S * 0.05, S * 0.014, 'pedal'));

    } else if (index === 1) {
      st.name = '앰프 스택';
      st.sub = '앰프와 마이크 스탠드를 넘어라!';
      st.picksLeft = 3;

      var GX2 = W * 0.865;
      var rw = Math.min(S * 0.21, W * 0.19), rh = S * 0.145;
      var gw2 = Math.min(S * 0.155, W * 0.17), gh2 = S * 0.10;
      st.goal = { x: GX2 - gw2 / 2, y: gy - rh - gh2, w: gw2, h: gh2, kind: 'fan', label: 'FAN ZONE' };
      st.obstacles.push(solid(GX2 - rw / 2, gy - rh, rw, rh, 'riser', 0.5));

      var span = GX2 - ax;
      var a1w = Math.min(S * 0.17, span * 0.21), a1h = S * 0.255;
      var a2w = Math.min(S * 0.125, span * 0.16), a2h = S * 0.145;
      var a1x = ax + span * 0.30;
      var a2x = ax + span * 0.555;
      var mx = ax + span * 0.755;
      st.obstacles.push(solid(a1x - a1w / 2, gy - a1h, a1w, a1h, 'amp', 0.5));
      st.obstacles.push(solid(a2x - a2w / 2, gy - a2h, a2w, a2h, 'amp', 0.5));
      st.obstacles.push(solid(mx - S * 0.007, gy - S * 0.265, S * 0.014, S * 0.265, 'mic', 0.42));
      st.obstacles.push(decor(mx - S * 0.03, gy - S * 0.265, S * 0.06, S * 0.03, 'michead'));
      st.obstacles.push(decor(ax + span * 0.13, gy - S * 0.02, S * 0.055, S * 0.02, 'cable'));

    } else {
      st.name = '앵콜 무대';
      st.sub = '이중 무대 위 VIP 피크 박스!';
      st.picksLeft = 4;
      st.windAmp = 0.070;

      var GX3 = W * 0.795;
      var span3 = GX3 - ax;
      var lowTop = gy - S * 0.185, upTop = gy - S * 0.365;
      var lowL = ax + span3 * 0.27, lowR = ax + span3 * 0.70;
      var upL = ax + span3 * 0.47, upR = Math.min(W * 0.955, GX3 + span3 * 0.45);
      /* lower deck */
      st.obstacles.push(solid(lowL, lowTop, lowR - lowL, S * 0.046, 'deck', 0.52));
      st.obstacles.push(decor(lowL + (lowR - lowL) * 0.05, lowTop + S * 0.046, (lowR - lowL) * 0.90, gy - lowTop - S * 0.046, 'skirt'));
      /* upper deck */
      st.obstacles.push(solid(upL, upTop, upR - upL, S * 0.046, 'deck', 0.52));
      st.obstacles.push(decor(upL + (upR - upL) * 0.04, upTop + S * 0.046, (upR - upL) * 0.92, gy - upTop - S * 0.046, 'skirt'));

      var bw = Math.min(S * 0.235, W * 0.22), bh = S * 0.125, wallT = S * 0.018;
      var bx = GX3 - bw / 2, by = upTop - bh;
      st.goal = { x: bx + wallT, y: by, w: bw - wallT * 2, h: bh, kind: 'vip', label: 'VIP' };
      st.obstacles.push(solid(bx, by + bh * 0.52, wallT, bh * 0.48, 'boxwall', 0.32));
      st.obstacles.push(solid(bx + bw - wallT, by, wallT, bh, 'boxwall', 0.32));
      st.obstacles.push(decor(bx + bw * 0.1, by + bh - S * 0.008, bw * 0.8, S * 0.008, 'velvet'));
      st.obstacles.push(decor(ax + W * 0.03, gy - S * 0.016, S * 0.05, S * 0.016, 'cable'));
    }
    return st;
  }

  function makePick(env, st, vx, vy) {
    return {
      x: st.anchor.x, y: st.anchor.y,
      vx: vx || 0, vy: vy || 0,
      r: env.pickR,
      angle: -0.5, spin: 0,
      alive: true, age: 0, restT: 0, bounces: 0, caught: false,
      ev: { goal: false, dead: false, bounce: null }
    };
  }

  var tmpEv = { goal: false, dead: false, bounce: null };

  /* advance one frame; returns shared event object */
  function stepPick(p, dt, env, st) {
    var e = tmpEv;
    e.goal = false; e.dead = false; e.bounce = null;
    if (!p.alive) { e.dead = true; return e; }

    var stepDt = Math.min(dt, 0.05);
    var sp0 = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    var SUB = Math.max(5, Math.min(20, Math.ceil(sp0 * stepDt / (env.pickR * 0.5))));
    var h = stepDt / SUB;

    for (var s = 0; s < SUB; s++) {
      p.vy += env.g * h;
      var dragF = 1 - env.airDrag * h;
      p.vx *= dragF; p.vy *= dragF;
      if (st.wind) p.vx += st.wind * env.g * h;
      p.x += p.vx * h;
      p.y += p.vy * h;
      p.angle += p.spin * h;
      p.spin *= (1 - 0.55 * h);

      for (var i = 0; i < st.obstacles.length; i++) {
        var rc = st.obstacles[i];
        if (!rc.solid) continue;
        var c = circleRect(p.x, p.y, p.r, rc);
        if (!c) continue;
        p.x += c.nx * c.pen;
        p.y += c.ny * c.pen;
        var vn = p.vx * c.nx + p.vy * c.ny;
        if (vn < 0) {
          var rest = rc.rest;
          p.vx -= (1 + rest) * vn * c.nx;
          p.vy -= (1 + rest) * vn * c.ny;
          var tx = -c.ny, ty = c.nx;
          var vt = p.vx * tx + p.vy * ty;
          p.vx -= tx * vt * 0.10;
          p.vy -= ty * vt * 0.10;
          p.spin = p.spin * 0.55 + vt * 0.035;
          var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
          if (sp > 30) {
            if (!e.bounce || sp > e.bounce.speed) {
              e.bounce = { x: p.x - c.nx * p.r, y: p.y - c.ny * p.r, nx: c.nx, ny: c.ny, kind: rc.kind, speed: sp };
            }
          }
          p.bounces++;
          if (sp < 26) p.restT += h; else p.restT = 0;
        }
      }

      /* floor */
      if (p.y + p.r > env.floorY) {
        p.y = env.floorY - p.r;
        if (p.vy > 0) {
          var spf = Math.abs(p.vy);
          p.vy = -p.vy * 0.40;
          p.vx *= 0.90;
          p.spin = p.spin * 0.6 + p.vx * 0.012;
          if (spf > 90) e.bounce = { x: p.x, y: env.floorY, nx: 0, ny: -1, kind: 'floor', speed: spf };
          p.restT += (spf < 45 ? h : 0);
        } else if (Math.abs(p.vx) < 26) {
          p.restT += h;
        }
      }
      /* walls */
      if (p.x - p.r < 0) { p.x = p.r; if (p.vx < 0) { p.vx = -p.vx * 0.45; } }
      if (p.x + p.r > env.W) { p.x = env.W - p.r; if (p.vx > 0) { p.vx = -p.vx * 0.45; } }

      /* goal */
      var gl = st.goal;
      if (gl && p.x > gl.x && p.x < gl.x + gl.w && p.y > gl.y && p.y < gl.y + gl.h) {
        p.caught = true; p.alive = false;
        e.goal = true;
        return e;
      }
    }

    p.age += dt;
    if (p.y > env.H + env.S * 0.6 || p.x < -env.S * 0.6 || p.x > env.W + env.S * 0.6) {
      p.alive = false; e.dead = true;
    } else if (p.restT > 0.42) {
      p.alive = false; e.dead = true;
    } else if (p.age > 9) {
      p.alive = false; e.dead = true;
    }
    return e;
  }

  function simulate(st, env, vx, vy, maxT) {
    var p = makePick(env, st, vx, vy);
    p.spin = 0;
    var dt = 1 / 120, t = 0;
    while (t < (maxT || 7)) {
      var e = stepPick(p, dt, env, st);
      t += dt;
      if (e.goal) return { hit: true, t: t, x: p.x, y: p.y, p: p };
      if (e.dead) return { hit: false, t: t, x: p.x, y: p.y, p: p };
    }
    return { hit: false, t: t, x: p.x, y: p.y, p: p };
  }

  /* dotted preview: sample points of the flight */
  function previewPath(st, env, vx, vy) {
    var p = makePick(env, st, vx, vy);
    var dt = 1 / 120, pts = [], i = 0, t = 0;
    while (t < 2.4 && pts.length < 46) {
      var e = stepPick(p, dt, env, st);
      t += dt; i++;
      if (i % 6 === 0) pts.push({ x: p.x, y: p.y });
      if (e.goal || e.dead) break;
    }
    return pts;
  }

  return {
    TAU: TAU, clamp: clamp,
    makeEnv: makeEnv, buildStage: buildStage, makePick: makePick,
    stepPick: stepPick, simulate: simulate, previewPath: previewPath
  };
})();
/* ===================== END MODEL ===================== */
</script>

/* =====================================================================
   2. Audio (Web Audio API, fully synthesized)
   ===================================================================== */
var SFX = (function () {
  var ac = null, master = null, noiseBuf = null, muted = false;
  var cache = {};

  function ensure() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.5;
    master.connect(ac.destination);
    var len = Math.floor(ac.sampleRate * 1.0);
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return ac;
  }

  /* Karplus-Strong plucked string (cached per pitch) */
  function pluckBuf(freq) {
    var key = Math.round(freq * 8);
    if (cache[key]) return cache[key];
    var sr = ac.sampleRate;
    var dur = 1.9;
    var n = Math.floor(sr * dur);
    var buf = ac.createBuffer(1, n, sr);
    var d = buf.getChannelData(0);
    var period = Math.max(2, Math.round(sr / freq));
    var ring = new Float32Array(period);
    for (var i = 0; i < period; i++) ring[i] = Math.random() * 2 - 1;
    var idx = 0;
    for (var k = 0; k < n; k++) {
      var v = ring[idx];
      var nx = ring[(idx + 1) % period];
      ring[idx] = (v + nx) * 0.5 * 0.9986;
      d[k] = v;
      idx = (idx + 1) % period;
    }
    var atk = Math.floor(sr * 0.003);
    for (var a = 0; a < atk; a++) d[a] *= a / atk;
    var rel = Math.floor(sr * 0.5);
    for (var r = 0; r < rel; r++) d[n - 1 - r] *= r / rel;
    cache[key] = buf;
    return buf;
  }

  function note(freq, when, gain, bright) {
    if (!ac || muted) return;
    var src = ac.createBufferSource();
    src.buffer = pluckBuf(freq);
    var lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = bright ? 5200 : 2600;
    lp.Q.value = 0.7;
    var g = ac.createGain();
    g.gain.value = gain;
    var pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
    if (pan) pan.pan.value = (Math.random() - 0.5) * 0.35;
    src.connect(lp);
    if (pan) { lp.connect(pan); pan.connect(g); } else { lp.connect(g); }

    src.start(when);
    src.stop(when + 1.95);

  function noiseHit(when, dur, freq, q, gain, type) {

    var f = ac.createBiquadFilter();

    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);

    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);

  var CHORDS = {
    E: [82.41, 123.47, 164.81, 207.65, 246.94, 329.63],
    A: [110.00, 164.81, 220.00, 277.18, 329.63, 440.00],
    D: [146.83, 220.00, 293.66, 369.99, 440.00, 587.33]
  };

    for (var i = 0; i < freqs.length; i++) {
      note(freqs[i], when + i * (spread || 0.013) + Math.random() * 0.004, gain * (1 - i * 0.05), i > 2);
    }
  }

    init: function () { ensure(); },
    isMuted: function () { return muted; },
    setMuted: function (m) { muted = !!m; if (master) master.gain.value = m ? 0 : 0.5; },
    click: function () {

      tone(880, t, 0.06, 0.05, 'triangle');
    },
    launch: function (power) {
      if (!ensure()) return;

    thud: function (speed, kind) {

      var base = kind === 'amp' ? 92 : (kind === 'monitor' ? 130 : (kind === 'floor' ? 105 : 160));
      tone(base * (0.9 + Math.random() * 0.2), t, 0.16, 0.16 + 0.12 * p, 'sine');
      noiseHit(t, 0.09, kind === 'amp' ? 420 : 900, 1.1, 0.10 + 0.09 * p, 'lowpass');

    cheer: function () {
      if (!ensure()) return;
      var t = ac.currentTime + 0.02;
      strum(CHORDS.A, t, 0.2, 0.014);
      strum(CHORDS.E, t + 0.24, 0.16, 0.012);

      var src = ac.createBufferSource();

    },
    fail: function () {
      if (!ensure()) return;
      var t = ac.currentTime + 0.02;
      var ns = [220.0, 185.0, 146.83];
      for (var i = 0; i < ns.length; i++) {
        note(ns[i], t + i * 0.16, 0.12, false);
      }
      tone(110, t + 0.34, 0.5, 0.07, 'sine');
    },
    win: function () {
      if (!ensure()) return;
      var t = ac.currentTime + 0.02;
      strum(CHORDS.D, t, 0.18, 0.015);
      strum(CHORDS.A, t + 0.2, 0.16, 0.014);
      strum(CHORDS.E, t + 0.42, 0.18, 0.012);
      var arp = [440, 554.37, 659.25, 880];
      for (var i = 0; i < arp.length; i++) tone(arp[i], t + 0.3 + i * 0.09, 0.6, 0.045, 'triangle');
    },
    stretch: function () {
      if (!ensure()) return;
      noiseHit(ac.currentTime, 0.07, 700, 2.0, 0.04, 'bandpass');
    }
  };
})();

  var bg = document.createElement('canvas');

  var G = {
    env: null, stage: null, stageIndex: 0,
    score: 0, shownScore: 0,
    status: 'title',
    picksLeft: 3,
    pick: null,

  };

  /* ---------------- helpers ---------------- */
  function rr(g, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }
  function rand(a, b) { return a + Math.random() * (b - a); }

  /* ---------------- sizing ---------------- */
  function resize() {
    var rect = cv.getBoundingClientRect();
    W = Math.max(240, rect.width);
    H = Math.max(320, rect.height);
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    G.env = MODEL.makeEnv(W, H);
    S = G.env.S;
    loadStage(G.stageIndex, true);
  }

  /* ---------------- stage ---------------- */
  function loadStage(i, keepScore) {
    G.stageIndex = i;
    G.stage = MODEL.buildStage(i, G.env);
    G.picksLeft = G.stage.picksLeft;
    G.pick = MODEL.makePick(G.env, G.stage);
    G.pick.angle = -0.5;
    G.drag = null;
    G.trail = [];
    G.particles = [];
    G.confetti = [];
    G.recoil = 0;
    G.release = null;
    G.status = 'aim';
    G.wind = 0;
    renderBackground();
    updateHUD();
    var hintTxt = ['피크를 뒤로 당겼다 놓아라!', '앰프 위로 크게 띄워라!', '바람이 잦아들 때 던져라!'][i];
    elHint.textContent = hintTxt;
    if (i === 0) {
      showHint(G.firstShot);
    } else {
      showHint(true);
      clearTimeout(hintTimer);
      hintTimer = setTimeout(function () { if (G.status === 'aim') showHint(false); }, 4200);
    }
    var names = ['사운드 체크', '앰프 스택', '앵콜 무대'];
    document.getElementById('stageNum').textContent = 'STAGE ' + (i + 1) + ' / 3';
    document.getElementById('stageName').textContent = names[i];
  }

  /* ---------------- HUD ---------------- */
  var elScore = document.getElementById('scoreVal');
  var elPickRow = document.getElementById('pickRow');
  var elHint = document.getElementById('hintEl');

  function updateHUD() {
    elScore.textContent = Math.round(G.shownScore).toLocaleString('en-US');
    var total = G.stage ? G.stage.picksLeft : 3;
    var html = '';
    for (var i = 0; i < total; i++) {
      html += '<span class="pk' + (i < G.picksLeft ? '' : ' spent') + '"></span>';
    }
    elPickRow.innerHTML = html;
  }
  var hintTimer = null;
  function showHint(on) {
    G.hintOn = !!on;
    elHint.classList.toggle('show', !!on);
  }

  /* ---------------- overlays ---------------- */
  function ov(id, on) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('show', !!on);
  }
  function hideAll() {
    ['ovTitle', 'ovClear', 'ovFail', 'ovDone'].forEach(function (k) { ov(k, false); });
  }

  /* ---------------- background ---------------- */
  function renderBackground() {
    var env = G.env, st = G.stage;
    bg.width = Math.round(W * DPR);
    bg.height = Math.round(H * DPR);
    bgx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var g = bgx;
    g.clearRect(0, 0, W, H);

    /* --- venue wall --- */
    var wall = g.createLinearGradient(0, 0, 0, env.floorY);
    wall.addColorStop(0, '#08030f');
    wall.addColorStop(0.30, '#1a0724');
    wall.addColorStop(0.68, '#330d32');
    wall.addColorStop(1, '#2b0a22');
    g.fillStyle = wall;
    g.fillRect(0, 0, W, env.floorY + 2);

    /* big colour washes */
    var wash = g.createRadialGradient(W * 0.64, env.floorY - S * 0.30, 0, W * 0.64, env.floorY - S * 0.30, S * 1.05);
    wash.addColorStop(0, 'rgba(255,40,140,0.22)');
    wash.addColorStop(0.5, 'rgba(150,20,120,0.10)');
    wash.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = wash;
    g.fillRect(0, 0, W, env.floorY);

    var wash2 = g.createRadialGradient(W * 0.18, env.floorY - S * 0.32, 0, W * 0.18, env.floorY - S * 0.32, S * 0.72);
    wash2.addColorStop(0, 'rgba(255,150,80,0.14)');
    wash2.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = wash2;
    g.fillRect(0, 0, W, env.floorY);

    /* --- neon pick sign on the back wall --- */
    g.save();
    var sign = pickPath;
    var signTop = env.floorY * 0.09;
    var sr = Math.min(S * 0.30, (env.floorY - signTop) * 0.31);
    var sx = W * 0.60, sy = signTop + sr * 1.22;
    g.translate(sx, sy);
    g.rotate(-0.18);
    sign(g, sr);
    g.strokeStyle = 'rgba(255,110,200,0.16)';
    g.lineWidth = Math.max(2, S * 0.008);
    g.shadowColor = 'rgba(255,60,170,0.55)';
    g.shadowBlur = S * 0.09;
    g.stroke();
    g.shadowBlur = 0;
    sign(g, sr * 0.62);
    g.strokeStyle = 'rgba(255,170,225,0.10)';
    g.lineWidth = Math.max(1, S * 0.004);
    g.stroke();
    g.restore();

    /* back wall haze bands */
    for (var hz = 0; hz < 3; hz++) {
      var hy = env.floorY - S * (0.16 + hz * 0.22);
      var hg = g.createLinearGradient(0, hy - S * 0.06, 0, hy + S * 0.06);
      hg.addColorStop(0, 'rgba(255,190,230,0)');
      hg.addColorStop(0.5, 'rgba(255,190,230,0.045)');
      hg.addColorStop(1, 'rgba(255,190,230,0)');
      g.fillStyle = hg;
      g.fillRect(0, hy - S * 0.06, W, S * 0.12);

    /* --- ceiling truss --- */
    var trussY = H * 0.045;
    g.save();
    for (var row = 0; row < 2; row++) {
      var y0 = trussY + row * S * 0.055;
      g.strokeStyle = 'rgba(130,100,145,0.32)';
      g.lineWidth = Math.max(1, S * 0.004);
      g.beginPath();
      g.moveTo(0, y0); g.lineTo(W, y0);
      g.moveTo(0, y0 + S * 0.035); g.lineTo(W, y0 + S * 0.035);
      g.stroke();
      g.strokeStyle = 'rgba(160,120,175,0.15)';
      var step = S * 0.075;
      g.beginPath();
      for (var x = -step; x < W + step; x += step) {
        g.moveTo(x, y0); g.lineTo(x + step, y0 + S * 0.035);

      g.stroke();
    }

    var fx = [0.18, 0.44, 0.70, 0.94];

      g.lineWidth = 1;

      for (var b = 0; b < 5; b++) {
        var by = trussY + S * 0.17 + b * S * 0.045;

      rr(g, bx, env.floorY - bh, S * 0.085, bh, 2);

      g.moveTo(W / 2 + k * S * 0.12, env.floorY);
      g.lineTo(W / 2 + k * S * 0.42, H);
      g.stroke();
    }
    for (var r2 = 1; r2 <= 4; r2++) {
      var yy = env.floorY + (H - env.floorY) * (r2 / 4) * (r2 / 4);
      g.beginPath(); g.moveTo(0, yy); g.lineTo(W, yy); g.stroke();
    }
    g.restore();

    /* --- fan hand behind the stage monitors --- */
    drawGoalBase(g, st.goal, env);

    /* --- props --- */
    for (var p = 0; p < st.obstacles.length; p++) {
      drawProp(g, st.obstacles[p], env);
    }

    /* --- goal structure --- */
    drawGoalStatic(g, st.goal, env);

    /* --- crowd (front of stage) --- */
    drawCrowd(g, env);

    /* vignette */
    var vg = g.createRadialGradient(W * 0.5, H * 0.42, Math.min(W, H) * 0.30, W * 0.5, H * 0.5, Math.max(W, H) * 0.82);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.66)');
    g.fillStyle = vg;
    g.fillRect(0, 0, W, H);
  }

  function drawProp(g, o, env) {
    var S2 = env.S;
    if (o.kind === 'amp') {
      var x = o.x, y = o.y, w = o.w, h = o.h;
      g.save();
      g.shadowColor = 'rgba(0,0,0,0.55)';
      g.shadowBlur = S2 * 0.05;
      g.shadowOffsetY = S2 * 0.012;
      var body = g.createLinearGradient(x, 0, x + w, 0);
      body.addColorStop(0, '#2a1a2c');
      body.addColorStop(0.35, '#3d2439');
      body.addColorStop(1, '#180e1c');
      g.fillStyle = body;
      rr(g, x, y, w, h, Math.min(w, h) * 0.05);
      g.fill();
      g.restore();

      /* grille */
      var pad = Math.max(2, w * 0.07);
      g.save();
      rr(g, x + pad, y + pad * 1.5, w - pad * 2, h - pad * 2.8, 2);
      g.fillStyle = '#120b14';
      g.fill();
      g.clip();
      g.strokeStyle = 'rgba(255,190,150,0.07)';
      g.lineWidth = 1;
      for (var i = 0; i < w; i += 3) {
        g.beginPath(); g.moveTo(x + pad + i, y); g.lineTo(x + pad + i, y + h); g.stroke();
      }
      for (var j = 0; j < h; j += 3) {
        g.beginPath(); g.moveTo(x, y + pad + j); g.lineTo(x + w, y + pad + j); g.stroke();
      }
      g.restore();

      /* top panel + knobs */
      var ph = Math.max(5, h * 0.06);
      g.fillStyle = 'rgba(201,162,74,0.75)';
      g.fillRect(x + pad, y + pad * 0.5, w - pad * 2, Math.max(1.5, ph * 0.28));
      var kn = Math.max(2, Math.min(4, Math.round(w / 16)));
      for (var kx = 0; kx < kn; kx++) {
        g.beginPath();
        g.arc(x + pad + (w - pad * 2) * ((kx + 0.5) / kn), y + pad * 0.5 + ph * 1.3, Math.max(1.4, w * 0.020), 0, TAU);
        g.fillStyle = '#160d15';
        g.fill();
        g.strokeStyle = 'rgba(225,190,120,0.75)';
        g.lineWidth = 1;
        g.stroke();
      }
      /* corner caps + piping */
      g.strokeStyle = 'rgba(230,200,140,0.28)';
      g.lineWidth = Math.max(1, w * 0.012);
      g.strokeRect(x + pad * 0.6, y + pad * 1.2, w - pad * 1.2, h - pad * 2.4);

    } else if (o.kind === 'monitor') {
      var x2 = o.x, y2 = o.y, w2 = o.w, h2 = o.h;
      g.save();
      g.beginPath();
      g.moveTo(x2, y2);
      g.lineTo(x2 + w2, y2);
      g.lineTo(x2 + w2 * 0.93, y2 + h2 * 0.55);
      g.lineTo(x2 + w2 * 0.08, y2 + h2);
      g.closePath();
      var mg = g.createLinearGradient(0, y2, 0, y2 + h2);
      mg.addColorStop(0, '#3f2740');
      mg.addColorStop(1, '#150b16');
      g.fillStyle = mg;
      g.fill();
      g.strokeStyle = 'rgba(255,170,215,0.25)';
      g.lineWidth = 1.4;
      g.stroke();
      /* grille front */
      g.beginPath();
      g.moveTo(x2 + w2 * 0.09, y2 + h2 * 0.94);
      g.lineTo(x2 + w2 * 0.92, y2 + h2 * 0.52);
      g.lineTo(x2 + w2 * 0.92, y2 + h2 * 0.94);
      g.closePath();
      g.fillStyle = '#0f0812';
      g.fill();
      g.restore();
      /* top edge light */
      g.strokeStyle = 'rgba(180,240,255,0.42)';
      g.lineWidth = 2;
      g.beginPath(); g.moveTo(x2 + 2, y2 + 1); g.lineTo(x2 + w2 - 2, y2 + 1); g.stroke();

    } else if (o.kind === 'riser' || o.kind === 'deck') {
      var x3 = o.x, y3 = o.y, w3 = o.w, h3 = o.h;
      g.save();
      var dg = g.createLinearGradient(0, y3, 0, y3 + h3);
      dg.addColorStop(0, '#301c35');
      dg.addColorStop(1, '#110a16');
      g.fillStyle = dg;
      g.fillRect(x3, y3, w3, h3);
      g.fillStyle = 'rgba(255,180,230,0.12)';
      g.fillRect(x3, y3, w3, Math.max(2, h3 * 0.16));
      g.strokeStyle = 'rgba(0,0,0,0.35)';
      g.lineWidth = 1;
      for (var sx = x3 + w3 * 0.06; sx < x3 + w3; sx += Math.max(6, w3 * 0.06)) {
        g.beginPath(); g.moveTo(sx, y3 + h3 * 0.2); g.lineTo(sx, y3 + h3); g.stroke();
      }
      /* led strip */
      g.shadowColor = 'rgba(120,230,255,0.9)';
      g.shadowBlur = S2 * 0.03;
      g.fillStyle = 'rgba(160,245,255,0.9)';
      g.fillRect(x3 + w3 * 0.03, y3 + h3 * 0.02, w3 * 0.94, Math.max(1.5, h3 * 0.05));
      g.restore();

    } else if (o.kind === 'skirt') {
      var sg = g.createLinearGradient(0, o.y, 0, o.y + o.h);
      sg.addColorStop(0, '#221428');
      sg.addColorStop(0.35, '#140c18');
      sg.addColorStop(1, '#08040b');
      g.fillStyle = sg;
      g.fillRect(o.x, o.y, o.w, o.h);
      /* curtain folds */
      g.strokeStyle = 'rgba(0,0,0,0.45)';
      g.lineWidth = 1;
      for (var fx2 = o.x + o.w * 0.08; fx2 < o.x + o.w; fx2 += Math.max(6, o.w * 0.09)) {
        g.beginPath();
        g.moveTo(fx2, o.y);
        g.lineTo(fx2 + o.w * 0.01, o.y + o.h);
        g.stroke();
      }
      g.fillStyle = 'rgba(255,150,210,0.07)';
      g.fillRect(o.x, o.y, o.w, Math.max(1, o.h * 0.02));

    } else if (o.kind === 'mic') {
      var cx = o.x + o.w / 2;
      g.save();
      g.strokeStyle = 'rgba(190,200,220,0.55)';
      g.lineWidth = Math.max(1.5, S2 * 0.005);
      g.beginPath();
      g.moveTo(cx, o.y + o.h - S2 * 0.055);
      g.lineTo(cx - S2 * 0.035, o.y + o.h);
      g.moveTo(cx, o.y + o.h - S2 * 0.055);
      g.lineTo(cx + S2 * 0.035, o.y + o.h);
      g.moveTo(cx, o.y + o.h - S2 * 0.055);
      g.lineTo(cx, o.y + o.h);
      g.stroke();
      var pg = g.createLinearGradient(cx - 3, 0, cx + 3, 0);
      pg.addColorStop(0, '#4a4a58');
      pg.addColorStop(0.4, '#cfd4e2');
      pg.addColorStop(1, '#2c2c38');
      g.fillStyle = pg;
      g.fillRect(cx - Math.max(1.2, S2 * 0.005), o.y, Math.max(2.4, S2 * 0.010), o.h);
      g.restore();

    } else if (o.kind === 'michead') {
      var mx = o.x + o.w / 2, my = o.y + o.h * 0.45;
      g.save();
      g.translate(mx, my);
      g.rotate(-0.5);
      g.fillStyle = '#20202a';
      rr(g, -S2 * 0.019, -S2 * 0.013, S2 * 0.042, S2 * 0.026, S2 * 0.013);
      g.fill();
      g.fillStyle = 'rgba(200,210,230,0.5)';
      rr(g, -S2 * 0.016, -S2 * 0.010, S2 * 0.036, S2 * 0.008, S2 * 0.004);
      g.fill();
      g.restore();

    } else if (o.kind === 'boxwall') {
      g.fillStyle = '#2a1420';
      g.fillRect(o.x, o.y, o.w, o.h);
      g.fillStyle = 'rgba(255,200,120,0.55)';
      g.fillRect(o.x, o.y, o.w, Math.max(1.5, S2 * 0.005));
      g.fillStyle = 'rgba(0,0,0,0.35)';
      g.fillRect(o.x, o.y, Math.max(1, o.w * 0.3), o.h);

    } else if (o.kind === 'bottle') {
      var bx2 = o.x, by2 = o.y, bw2 = o.w, bh2 = o.h;
      g.save();
      g.fillStyle = 'rgba(120,220,255,0.16)';
      rr(g, bx2, by2 + bh2 * 0.25, bw2, bh2 * 0.75, 2);
      g.fill();
      g.fillStyle = 'rgba(120,220,255,0.5)';
      g.fillRect(bx2 + bw2 * 0.32, by2, bw2 * 0.36, bh2 * 0.3);
      g.fillStyle = 'rgba(192,57,43,0.9)';
      g.fillRect(bx2, by2 + bh2 * 0.32, bw2, bh2 * 0.14);
      g.restore();

    } else if (o.kind === 'pedal') {
      g.save();
      g.fillStyle = '#2b6fb0';
      rr(g, o.x, o.y, o.w, o.h, 1.5);
      g.fill();
      g.fillStyle = 'rgba(255,255,255,0.35)';
      g.fillRect(o.x + o.w * 0.1, o.y + o.h * 0.15, o.w * 0.25, o.h * 0.3);
      g.restore();

    } else if (o.kind === 'cable') {
      g.save();
      g.strokeStyle = 'rgba(16,10,20,0.95)';
      g.lineWidth = Math.max(2, S2 * 0.008);
      g.beginPath();
      g.moveTo(o.x, o.y + o.h * 0.5);
      g.bezierCurveTo(o.x + o.w * 0.3, o.y - o.h * 0.9, o.x + o.w * 0.7, o.y + o.h * 1.6, o.x + o.w, o.y + o.h * 0.5);
      g.stroke();
      g.restore();

    } else if (o.kind === 'velvet') {
      g.fillStyle = 'rgba(150,20,70,0.85)';
      g.fillRect(o.x, o.y, o.w, o.h);
    }
  }

  /* the fan's hand reaching up from the pit (drawn behind the monitors) */
  function drawGoalBase(g, gl, env) {
    if (!gl || gl.kind === 'vip') return;
    var S2 = env.S;
    var cx = gl.x + gl.w / 2;
    var hw = gl.w * 0.80;
    var top = gl.y + gl.h * 0.10;
    var bot = gl.y + gl.h * 1.30;
    g.save();
    /* arm / wrist */
    g.fillStyle = '#e9c9a8';
    rr(g, cx - hw * 0.30, top + gl.h * 0.5, hw * 0.60, bot - top, hw * 0.12);
    g.fill();
    /* fingers */
    for (var f = 0; f < 4; f++) {
      var fw = hw * 0.185;
      var fx2 = cx - hw * 0.42 + f * hw * 0.235;
      var fh = gl.h * (f === 0 || f === 3 ? 0.52 : 0.72);
      g.beginPath();
      rr(g, fx2, top + (gl.h * 0.62 - fh), fw, fh + gl.h * 0.30, fw * 0.5);
      g.fill();
      g.strokeStyle = 'rgba(40,16,30,0.85)';
      g.lineWidth = Math.max(1.2, S2 * 0.005);
      g.stroke();
    }
    /* palm */
    g.beginPath();
    rr(g, cx - hw * 0.46, top + gl.h * 0.42, hw * 0.92, gl.h * 0.85, hw * 0.16);
    g.fill();
    g.strokeStyle = 'rgba(40,16,30,0.85)';
    g.lineWidth = Math.max(1.2, S2 * 0.005);
    g.stroke();
    /* net strands inside the hoop (the monitor covers the lower part) */
    g.strokeStyle = 'rgba(170,245,255,0.32)';
    g.lineWidth = Math.max(1, S2 * 0.003);
    for (var n = 0; n < 7; n++) {
      var t = n / 6;
      var nx = cx + (t - 0.5) * gl.w * 1.15;
      g.beginPath();
      g.moveTo(nx, gl.y + gl.h * 0.52);
      g.quadraticCurveTo(cx + (t - 0.5) * gl.w * 0.5, gl.y + gl.h * 1.05, cx + (t - 0.5) * gl.w * 0.10, gl.y + gl.h * 1.6);
      g.stroke();
    }

    /* rim light */
    g.strokeStyle = 'rgba(255,190,150,0.55)';
    g.lineWidth = Math.max(1.2, S2 * 0.006);
    g.beginPath();
    g.ellipse(cx - hw * 0.10, top + gl.h * 0.20, hw * 0.36, gl.h * 0.20, 0, Math.PI * 1.05, Math.PI * 1.95);
    g.stroke();
    g.restore();
  }

  function drawGoalStatic(g, gl, env) {
    if (!gl) return;
    var S2 = env.S;
    if (gl.kind === 'vip') {
      var bx = gl.x - S2 * 0.018, by = gl.y, bw = gl.w + S2 * 0.036, bh = gl.h;
      g.save();
      var bgd = g.createLinearGradient(bx, by, bx, by + bh);
      bgd.addColorStop(0, '#3d1e24');
      bgd.addColorStop(1, '#160910');
      g.fillStyle = bgd;
      g.fillRect(bx, by, bw, bh);
      var ig = g.createLinearGradient(0, by, 0, by + bh);
      ig.addColorStop(0, 'rgba(255,190,120,0.55)');
      ig.addColorStop(0.35, 'rgba(255,80,140,0.42)');
      ig.addColorStop(1, 'rgba(70,0,40,0.75)');
      g.fillStyle = ig;
      g.fillRect(gl.x, by + S2 * 0.006, gl.w, bh - S2 * 0.006);
      /* velvet pool at the bottom of the box */
      var vg2 = g.createRadialGradient(gl.x + gl.w / 2, by + bh, 0, gl.x + gl.w / 2, by + bh, gl.w * 0.7);
      vg2.addColorStop(0, 'rgba(255,140,190,0.35)');
      vg2.addColorStop(1, 'rgba(255,140,190,0)');
      g.fillStyle = vg2;
      g.fillRect(gl.x, by, gl.w, bh);
      /* bright lip on the open mouth */
      g.fillStyle = 'rgba(255,235,190,0.95)';
      g.fillRect(bx, by - Math.max(1, S2 * 0.004), bw, Math.max(1.5, S2 * 0.008));
      g.strokeStyle = 'rgba(255,205,120,0.9)';
      g.lineWidth = Math.max(1.5, S2 * 0.006);
      g.strokeRect(bx, by, bw, bh);
      g.restore();
      g.save();
      g.fillStyle = 'rgba(255,220,150,0.95)';
      g.font = '900 ' + (S2 * 0.052) + 'px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText('VIP', bx + bw / 2, by + bh * 0.80);
      g.restore();
    } else {
      var cx = gl.x + gl.w / 2;
      var cy = gl.y + gl.h * 0.52;
      /* catch zone */
      g.save();
      g.beginPath();
      g.ellipse(cx, cy, gl.w * 0.52, gl.h * 0.52, 0, 0, TAU);
      var fg = g.createRadialGradient(cx, cy, 0, cx, cy, gl.w * 0.6);
      fg.addColorStop(0, 'rgba(130,245,255,0.26)');
      fg.addColorStop(0.7, 'rgba(90,200,255,0.10)');
      fg.addColorStop(1, 'rgba(90,200,255,0)');
      g.fillStyle = fg;
      g.fill();
      /* hoop */
      g.strokeStyle = 'rgba(150,248,255,0.95)';
      g.lineWidth = Math.max(2.5, S2 * 0.011);
      g.shadowColor = 'rgba(90,230,255,0.95)';
      g.shadowBlur = S2 * 0.06;
      g.beginPath();
      g.ellipse(cx, cy, gl.w * 0.60, gl.h * 0.56, 0, 0, TAU);
      g.stroke();
      g.restore();
      /* label */
      g.save();
      g.font = '800 ' + (S2 * 0.030) + 'px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillStyle = 'rgba(160,248,255,0.85)';
      g.shadowColor = 'rgba(90,230,255,0.8)';
      g.shadowBlur = S2 * 0.04;
      g.fillText(gl.label, cx, gl.y - S2 * 0.038);
      g.restore();
    }
  }

  function drawCrowd(g, env) {
    var S2 = env.S;
    var baseY = H * 0.955;
    g.save();
    g.beginPath();
    g.moveTo(-2, H + 2);
    g.lineTo(-2, baseY);
    var n = Math.max(9, Math.round(W / (S2 * 0.085)));
    for (var i = 0; i < n; i++) {
      var x = (i + 0.5) * W / n;
      var r = S2 * (0.024 + ((i * 37) % 9) / 260);
      g.arc(x, baseY + r * 0.55, r, Math.PI, TAU);
    }
    g.lineTo(W + 2, baseY);
    g.lineTo(W + 2, H + 2);
    g.closePath();
    g.fillStyle = 'rgba(3,1,6,0.97)';
    g.fill();
    /* warm rim light on the heads */
    g.strokeStyle = 'rgba(255,120,180,0.22)';
    g.lineWidth = Math.max(1, S2 * 0.004);
    g.stroke();
    /* raised arms */
    g.strokeStyle = 'rgba(3,1,6,0.97)';
    g.lineWidth = Math.max(4, S2 * 0.014);
    g.lineCap = 'round';
    var arms = [0.10, 0.21, 0.30, 0.47, 0.62, 0.72, 0.83, 0.93];
    for (var a = 0; a < arms.length; a++) {
      var ax = W * arms[a];
      var ay = baseY + S2 * 0.01;
      g.beginPath();
      g.moveTo(ax, ay);
      g.quadraticCurveTo(ax + ((a % 2) ? -1 : 1) * S2 * 0.012, ay - S2 * 0.05, ax + ((a % 2) ? -1 : 1) * S2 * 0.030, ay - S2 * 0.085);
      g.stroke();
    }
    /* phone lights */
    for (var p = 0; p < 10; p++) {
      var px = W * (0.07 + p * 0.095) + ((p * 53) % 17);
      var py = baseY - S2 * (0.075 + ((p * 31) % 13) / 300);
      g.fillStyle = 'rgba(255,238,205,' + (0.45 + ((p * 17) % 35) / 100) + ')';
      g.beginPath(); g.arc(px, py, Math.max(1.1, S2 * 0.0045), 0, TAU); g.fill();
    }
    g.restore();
  }

  /* ---------------- dynamic scene ---------------- */
  function drawLights(time) {
    var env = G.env;
    var S2 = env.S;
    var beams = [
      { x: 0.18, hue: 'rgba(120,220,255,', sp: 0.7, ph: 0.0 },
      { x: 0.44, hue: 'rgba(255,70,170,', sp: 0.55, ph: 1.7 },
      { x: 0.70, hue: 'rgba(180,90,255,', sp: 0.62, ph: 3.1 },
      { x: 0.94, hue: 'rgba(255,140,90,', sp: 0.5, ph: 4.4 }
    ];
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, env.floorY);
    ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < beams.length; i++) {
      var b = beams[i];
      var cx = W * b.x;
      var cy = H * 0.045 + S2 * 0.16;
      var ang = Math.sin(time * b.sp + b.ph) * 0.55 + Math.PI / 2 + (b.x - 0.5) * 0.5;
      var len = S2 * 2.4;
      var spread = 0.15;
      var x1 = cx + Math.cos(ang - spread) * len;
      var y1 = cy + Math.sin(ang - spread) * len;
      var x2 = cx + Math.cos(ang + spread) * len;
      var y2 = cy + Math.sin(ang + spread) * len;
      var grd = ctx.createLinearGradient(cx, cy, cx, cy + len * 0.8);
      grd.addColorStop(0, b.hue + '0.17)');
      grd.addColorStop(0.45, b.hue + '0.055)');
      grd.addColorStop(1, b.hue + '0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.closePath();
      ctx.fill();
      var lg = ctx.createRadialGradient(cx, cy, 0, cx, cy, S2 * 0.11);
      lg.addColorStop(0, b.hue + '0.60)');
      lg.addColorStop(1, b.hue + '0)');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.arc(cx, cy, S2 * 0.11, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawGoalGlow(time) {
    var gl = G.stage.goal;
    if (!gl) return;
    var cx = gl.x + gl.w / 2, cy = gl.y + gl.h / 2;
    var pulse = 0.5 + 0.5 * Math.sin(time * 2.4);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var r = Math.max(gl.w, gl.h) * (0.85 + pulse * 0.18);
    if (gl.kind === 'vip') {
      var sway = Math.sin(time * 0.55) * Sf(0.035);
      var sg = ctx.createLinearGradient(0, 0, 0, gl.y + gl.h * 0.5);
      sg.addColorStop(0, 'rgba(255,215,150,0)');
      sg.addColorStop(0.72, 'rgba(255,210,145,0.075)');
      sg.addColorStop(1, 'rgba(255,215,150,0.17)');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.moveTo(cx - Sf(0.018) + sway * 0.35, 0);
      ctx.lineTo(cx + Sf(0.018) + sway * 0.35, 0);
      ctx.lineTo(cx + gl.w * 0.62 + sway, gl.y + gl.h * 0.55);
      ctx.lineTo(cx - gl.w * 0.62 + sway, gl.y + gl.h * 0.55);
      ctx.closePath();
      ctx.fill();
    }
    var grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.8);
    var col = gl.kind === 'vip' ? '255,190,90' : '120,240,255';
    grd.addColorStop(0, 'rgba(' + col + ',' + (0.26 + pulse * 0.12) + ')');
    grd.addColorStop(0.45, 'rgba(' + col + ',0.09)');
    grd.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(cx, cy, r * 1.8, 0, TAU); ctx.fill();
    ctx.restore();

    ctx.save();
    for (var i = 0; i < 7; i++) {
      var ph = (time * 0.35 + i * 0.37) % 1;
      var sx = cx + Math.sin(i * 2.1 + time * 0.8) * gl.w * 0.55;
      var sy = gl.y + gl.h - ph * gl.h * 2.2;
      var al = Math.sin(ph * Math.PI) * 0.7;
      ctx.fillStyle = gl.kind === 'vip' ? 'rgba(255,220,150,' + al + ')' : 'rgba(180,250,255,' + al + ')';
      ctx.beginPath(); ctx.arc(sx, sy, Math.max(1, Sf(0.005)) * (1 - ph * 0.5), 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
  function Sf(v) { return G.env.S * v; }

  function drawCharacter(time) {
    var st = G.stage, env = G.env;
    var S2 = env.S;
    var bob = Math.sin(time * 1.5) * S2 * 0.006;
    var lean = 0;

    var drag = G.drag;
    if (G.status === 'aim' && drag) {
      lean = clamp(drag.pull.x / env.maxDrag, -1, 1) * 0.05;
    }
    /* strum bounce right after the pick leaves the hand */
    var rl = G.recoil;
    var ph = 1 - rl;
    var wob = Math.sin(ph * Math.PI * 3.0) * rl;
    var kick = Math.max(0, wob);

    /* spotlight pool on the floor under the figure */
    var fy = env.floorY;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var pool = ctx.createRadialGradient(st.charCx, fy, 0, st.charCx, fy, st.charW * 1.20);
    pool.addColorStop(0, 'rgba(255,205,155,0.20)');
    pool.addColorStop(0.55, 'rgba(255,150,110,0.08)');
    pool.addColorStop(1, 'rgba(255,140,100,0)');
    ctx.fillStyle = pool;
    ctx.beginPath();
    ctx.ellipse(st.charCx, fy, st.charW * 1.10, st.charW * 0.26, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    /* warm halo behind the figure */
    ctx.save();
    var lg = ctx.createRadialGradient(st.charCx, st.charBaseY - st.charH * 0.55, 0, st.charCx, st.charBaseY - st.charH * 0.55, st.charH * 0.95);
    lg.addColorStop(0, 'rgba(255,225,180,0.13)');
    lg.addColorStop(0.55, 'rgba(255,170,120,0.05)');
    lg.addColorStop(1, 'rgba(255,150,100,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(st.charCx - st.charH, st.charBaseY - st.charH * 1.7, st.charH * 2, st.charH * 1.9);
    ctx.restore();

    /* body */
    ctx.save();
    ctx.translate(st.charCx + wob * S2 * 0.010, st.charBaseY + bob - kick * S2 * 0.006);
    ctx.rotate(lean - wob * 0.030);
    var stretch = 1 + kick * 0.022;
    ctx.scale(stretch, 1 / stretch);
    if (spriteOK) {
      ctx.shadowColor = 'rgba(255,200,150,0.45)';
      ctx.shadowBlur = S2 * 0.055;
      ctx.drawImage(spriteFade || sprite, -st.charW / 2, -st.charH, st.charW, st.charH);
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = '#f6eddf';
      rr(ctx, -st.charW / 2, -st.charH, st.charW, st.charH, 10);
      ctx.fill();
    }
    ctx.restore();
  }

  function pickPath(g, r) {
    g.beginPath();
    g.moveTo(0, r * 1.0);
    g.bezierCurveTo(-r * 0.62, r * 0.58, -r * 1.02, -r * 0.18, -r * 0.74, -r * 0.62);
    g.bezierCurveTo(-r * 0.5, -r * 0.98, r * 0.5, -r * 0.98, r * 0.74, -r * 0.62);
    g.bezierCurveTo(r * 1.02, -r * 0.18, r * 0.62, r * 0.58, 0, r * 1.0);
    g.closePath();
  }

  function drawRelease() {
    if (!G.release) return;
    var st = G.stage, a = 1 - G.release.t / 0.20;
    if (a <= 0) return;
    var x1 = G.release.x0, y1 = G.release.y0;
    var x2 = st.anchor.x, y2 = st.anchor.y;
    var r0 = G.env.pickR;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalAlpha = a * 0.85;
    ctx.strokeStyle = 'rgba(255,250,235,0.95)';
    ctx.lineWidth = Math.max(1.5, r0 * 1.1 * a);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.globalAlpha = a * 0.55;
    ctx.strokeStyle = 'rgba(255,240,205,0.9)';
    ctx.lineWidth = Math.max(1, r0 * 2.4 * a);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    /* ring pulse at the hand */
    var rr2 = r0 * (1.6 + (1 - a) * 3.4);
    ctx.globalAlpha = a * 0.7;
    ctx.strokeStyle = 'rgba(255,252,240,0.9)';
    ctx.lineWidth = Math.max(1.2, r0 * 0.35);
    ctx.beginPath(); ctx.arc(x2, y2, rr2, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  function drawPickShape(g, x, y, r, ang, alpha, glow) {
    g.save();
    g.globalAlpha = alpha;
    g.translate(x, y);
    g.rotate(ang);
    if (glow) {
      g.shadowColor = 'rgba(255,247,224,0.95)';
      g.shadowBlur = Sf(0.055);
    }
    var grd = g.createLinearGradient(-r * 0.8, -r * 0.95, r * 0.8, r * 0.95);
    grd.addColorStop(0, '#ffffff');
    grd.addColorStop(0.30, '#fdfdff');
    grd.addColorStop(0.62, '#eef2fa');
    grd.addColorStop(1, '#cfd8e8');
    pickPath(g, r);
    g.fillStyle = grd;
    g.fill();
    g.shadowBlur = 0;
    /* silver / dark rim so the white reads on a bright stage light too */
    g.strokeStyle = 'rgba(56,66,86,0.88)';
    g.lineWidth = Math.max(1, r * 0.135);
    g.stroke();
    g.globalAlpha = alpha * 0.55;
    pickPath(g, r * 0.80);
    g.strokeStyle = 'rgba(255,255,255,0.95)';
    g.lineWidth = Math.max(0.8, r * 0.06);
    g.stroke();
    /* pearly sheen */
    g.globalAlpha = alpha * 0.7;
    g.beginPath();
    g.ellipse(-r * 0.20, -r * 0.38, r * 0.30, r * 0.15, -0.6, 0, TAU);
    g.fillStyle = 'rgba(255,255,255,0.95)';
    g.fill();
    g.globalAlpha = alpha * 0.45;
    g.beginPath();
    g.ellipse(r * 0.18, r * 0.30, r * 0.22, r * 0.10, -0.5, 0, TAU);
    g.fillStyle = 'rgba(214,226,244,0.8)';
    g.fill();
    g.restore();
  }

  function drawBand(x1, y1, x2, y2, strength) {
    var S2 = G.env.S;
    var dx = x2 - x1, dy = y2 - y1;
    var len = Math.hypot(dx, dy) || 1;
    var nx = -dy / len, ny = dx / len;
    var sag = Math.min(len * 0.12, S2 * 0.03);
    ctx.save();
    ctx.lineCap = 'round';
    for (var side = -1; side <= 1; side += 2) {
      var ox = nx * S2 * 0.012 * side, oy = ny * S2 * 0.012 * side;
      ctx.beginPath();
      ctx.moveTo(x1 + ox, y1 + oy);
      ctx.quadraticCurveTo((x1 + x2) / 2 + ox + nx * sag, (y1 + y2) / 2 + oy + ny * sag, x2, y2);
      ctx.strokeStyle = 'rgba(255,60,150,' + (0.45 + strength * 0.4) + ')';
      ctx.lineWidth = Math.max(2, S2 * 0.008);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,220,240,' + (0.35 + strength * 0.45) + ')';
      ctx.lineWidth = Math.max(1, S2 * 0.003);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPreview(vx, vy) {
    var st = G.stage;
    var pts = MODEL.previewPath(st, G.env, vx, vy);
    ctx.save();
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      var t = i / pts.length;
      var a = (1 - t) * 0.85 + 0.1;
      var r = Math.max(1.2, Sf(0.007)) * (1 - t * 0.55);
      ctx.fillStyle = 'rgba(190,250,255,' + a + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawWind() {
    var st = G.stage;
    if (!st.windAmp) return;
    var env = G.env, S2 = env.S;
    var w = G.status === 'fly' ? (G.pick && G.pick.alive ? G.wind : 0) : G.wind;
    var strength = Math.abs(w) / st.windAmp;
    if (strength < 0.04) return;
    var dir = w > 0 ? 1 : -1;
    ctx.save();
    ctx.globalAlpha = 0.40 + strength * 0.5;
    ctx.strokeStyle = 'rgba(160,240,255,0.85)';
    ctx.lineCap = 'round';
    var y0 = env.floorY - S2 * 0.46, y1 = env.floorY - S2 * 0.08;
    for (var i = 0; i < 7; i++) {
      var yy = y0 + (y1 - y0) * (i / 6);
      var ph = (G.t * (0.35 + strength * 0.5) + i * 0.31) % 1;
      var xx = W * (0.28 + ph * 0.36);
      var lenw = S2 * (0.04 + strength * 0.06);
      ctx.lineWidth = Math.max(1.6, S2 * 0.005);
      ctx.beginPath();
      ctx.moveTo(xx, yy);
      ctx.lineTo(xx + lenw * dir, yy);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(xx + lenw * dir, yy);
      ctx.lineTo(xx + lenw * dir - dir * S2 * 0.012, yy - S2 * 0.010);
      ctx.moveTo(xx + lenw * dir, yy);
      ctx.lineTo(xx + lenw * dir - dir * S2 * 0.012, yy + S2 * 0.010);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------------- particles ---------------- */
  function spark(x, y, n, col, spd) {
    var S2 = G.env.S;
    for (var i = 0; i < n; i++) {
      var a = rand(0, TAU);
      var s = rand(0.3, 1) * (spd || S2 * 0.35);
      G.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - S2 * 0.08,
        life: rand(0.3, 0.75), max: 0.75,
        r: rand(1, Math.max(2, S2 * 0.007)),
        col: col || '255,210,240'
      });
    }
  }
  function confettiBurst() {
    var S2 = G.env.S;
    var cols = ['#ff3f9e', '#ffd257', '#5be6ff', '#b06bff', '#ffffff', '#ff8a5b'];
    for (var i = 0; i < 110; i++) {
      G.confetti.push({
        x: G.stage.goal.x + G.stage.goal.w * rand(0.1, 0.9) + rand(-1, 1) * S2 * 0.2,
        y: G.stage.goal.y + rand(-0.4, 0.4) * S2 * 0.3,
        vx: rand(-1, 1) * S2 * 0.5,
        vy: rand(-1.6, -0.2) * S2 * 0.5,
        w: rand(S2 * 0.008, S2 * 0.018),
        h: rand(S2 * 0.006, S2 * 0.014),
        rot: rand(0, TAU), vr: rand(-6, 6),
        col: cols[i % cols.length],
        life: rand(1.6, 3.0), max: 3.0
      });
    }
  }
  function updateParticles(dt) {
    var env = G.env;
    for (var i = G.particles.length - 1; i >= 0; i--) {
      var p = G.particles[i];
      p.life -= dt;
      if (p.life <= 0) { G.particles.splice(i, 1); continue; }
      p.vy += env.g * 0.35 * dt;
      p.vx *= (1 - 1.2 * dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (var j = G.confetti.length - 1; j >= 0; j--) {
      var c = G.confetti[j];
      c.life -= dt;
      if (c.life <= 0) { G.confetti.splice(j, 1); continue; }
      c.vy += env.g * 0.22 * dt;
      c.vx *= (1 - 0.9 * dt);
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.rot += c.vr * dt;
    }
  }
  function drawParticles() {
    ctx.save();
    for (var i = 0; i < G.particles.length; i++) {
      var p = G.particles[i];
      var a = Math.max(0, p.life / p.max);
      ctx.fillStyle = 'rgba(' + p.col + ',' + a + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * a + 0.4, 0, TAU);
      ctx.fill();
    }
    for (var j = 0; j < G.confetti.length; j++) {
      var c = G.confetti[j];
      var al = Math.min(1, c.life / 0.6);
      ctx.save();
      ctx.globalAlpha = al;
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.fillStyle = c.col;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h * (0.5 + 0.5 * Math.abs(Math.cos(c.rot * 1.7))));
      ctx.restore();
    }
    ctx.restore();
  }

  /* ---------------- flow ---------------- */
  function launch() {
    var env = G.env, d = G.drag;
    if (!d) return;
    var pull = d.pull;
    var len = Math.hypot(pull.x, pull.y);
    if (len < env.S * 0.012) { G.drag = null; return; }

    var vx = -pull.x * env.k;
    var vy = -pull.y * env.k;
    var vlen = Math.hypot(vx, vy);
    if (vlen > env.vmax) { vx *= env.vmax / vlen; vy *= env.vmax / vlen; vlen = env.vmax; }

    /* the pick leaves the picking hand: the sling snaps from the pulled point
       back to the hand and the pick shoots out from there */
    G.release = {
      x0: G.stage.anchor.x + pull.x,
      y0: G.stage.anchor.y + pull.y,
      t: 0
    };
    G.pick = MODEL.makePick(env, G.stage, vx, vy);
    G.pick.x = G.stage.anchor.x;
    G.pick.y = G.stage.anchor.y;
    G.pick.spin = 16 * (vx >= 0 ? 1 : -1);
    G.pick.angle = Math.atan2(vy, vx) + Math.PI / 2;
    G.status = 'fly';
    G.drag = null;
    G.trail = [];
    G.recoil = 1;
    G.shake = Math.min(1, vlen / env.vmax) * Sf(0.008);
    spark(G.stage.anchor.x, G.stage.anchor.y, 6, '255,250,235', Sf(0.22));
    SFX.launch(Math.min(1, vlen / env.vmax));
    G.firstShot = false;
    showHint(false);
  }

  function onWin() {
    if (G.status !== 'fly') return;
    G.status = 'win';
    G.shake = Sf(0.012);
    confettiBurst();
    spark(G.pick.x, G.pick.y, 26, '180,250,255', Sf(0.55));
    SFX.cheer();

    var used = G.stage.picksLeft - G.picksLeft + 1;
    var stars = used <= 1 ? 3 : (used === 2 ? 2 : 1);
    G.starsByStage[G.stageIndex] = Math.max(G.starsByStage[G.stageIndex] || 0, stars);
    var pts = 1000 + 500 * G.picksLeft;
    G.score += pts;

    setTimeout(function () {
      if (G.status !== 'win') return;
      document.getElementById('clearKicker').textContent = 'STAGE ' + (G.stageIndex + 1) + ' CLEAR';
      document.getElementById('clearMsg').textContent = ['관객이 피크를 받았다!', '앰프를 넘어 완벽한 궤적!', 'VIP 박스에 꽂혔다!'][G.stageIndex];
      document.getElementById('clearPt').textContent = pts.toLocaleString('en-US');
      for (var i = 0; i < 3; i++) {
        document.getElementById('st' + i).classList.toggle('on', i < stars);
      }
      document.getElementById('btnNext').textContent = G.stageIndex >= 2 ? '결과 보기' : '다음 무대';
      ov('ovClear', true);
    }, 1050);
  }

  function onMiss() {
    if (G.status !== 'fly') return;
    G.picksLeft -= 1;
    updateHUD();
    G.trail = [];

    if (G.picksLeft <= 0) {
      G.status = 'fail';
      SFX.fail();
      setTimeout(function () {
        if (G.status !== 'fail') return;
        var msgs = ['궤적을 다시 보고 던져봐!', '앰프 위로 더 크게 띄워봐!', '바람이 잦아들 때가 기회야!'];
        document.getElementById('failMsg').textContent = msgs[G.stageIndex];
        ov('ovFail', true);
      }, 620);
    } else {
      G.status = 'aim';
      setTimeout(function () {
        if (G.status !== 'aim') return;
        var st = G.stage;
        G.pick = MODEL.makePick(G.env, st);
        G.pick.angle = -0.5;
        SFX.click();
      }, 480);
    }
  }

  function nextStage() {
    ov('ovClear', false);
    if (G.stageIndex >= 2) {
      ov('ovDone', false);
      var tot = 0;
      for (var i = 0; i < 3; i++) tot += G.starsByStage[i] || 0;
      document.getElementById('finScore').textContent = G.score.toLocaleString('en-US');
      document.getElementById('finStars').textContent = tot + ' / 9';
      setTimeout(function () {
        SFX.win();
        ov('ovDone', true);
      }, 180);
      G.status = 'done';
      return;
    }
    loadStage(G.stageIndex + 1);
    G.score += 0;
  }

  function retryStage() {
    hideAll();
    loadStage(G.stageIndex);
    SFX.click();
  }

  function resetAll() {
    G.score = 0;
    G.shownScore = 0;
    G.starsByStage = [0, 0, 0];
    G.firstShot = true;
    hideAll();
    loadStage(0);
  }

  /* ---------------- input ---------------- */
  function pointerPos(e) {
    var rect = cv.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function dragStart(e) {
    SFX.init();
    if (G.status !== 'aim' || !G.pick) return;
    var p = pointerPos(e);
    G.drag = {
      id: e.pointerId,
      startX: p.x, startY: p.y,
      grabX: G.pick.x - p.x,
      grabY: G.pick.y - p.y,
      pull: { x: 0, y: 0 }
    };
    e.preventDefault();
  }

  function dragMove(e) {
    if (!G.drag || G.drag.id !== e.pointerId) return;
    var env = G.env, p = pointerPos(e);
    var px = p.x + G.drag.grabX;
    var py = p.y + G.drag.grabY;
    var dx = px - G.stage.anchor.x;
    var dy = py - G.stage.anchor.y;
    var len = Math.hypot(dx, dy);
    if (len > env.maxDrag) { dx *= env.maxDrag / len; dy *= env.maxDrag / len; }
    /* the pick never leaves the screen while aiming */
    var minX = env.pickR + 3 - G.stage.anchor.x;
    if (dx < minX) dx = minX;
    var maxDown = env.H - env.pickR - env.S * 0.02 - G.stage.anchor.y;
    if (dy > maxDown) dy = maxDown;
    G.drag.pull.x = dx;
    G.drag.pull.y = dy;
    G.pick.x = G.stage.anchor.x + dx;
    G.pick.y = G.stage.anchor.y + dy;
    e.preventDefault();
  }

  function dragEnd(e) {
    if (!G.drag || G.drag.id !== e.pointerId) return;
    var d = G.drag;
    var len = Math.hypot(d.pull.x, d.pull.y);
    if (len > G.env.S * 0.012) {
      launch();
    } else {
      G.pick.x = G.stage.anchor.x;
      G.pick.y = G.stage.anchor.y;
      G.drag = null;
    }
    e.preventDefault();
  }

  cv.addEventListener('pointerdown', dragStart);
  cv.addEventListener('pointermove', dragMove);
  cv.addEventListener('pointerup', dragEnd);
  cv.addEventListener('pointercancel', dragEnd);
  document.addEventListener('touchmove', function (e) {
    if (e.target === cv) e.preventDefault();
  }, { passive: false });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* buttons */
  document.getElementById('btnStart').addEventListener('click', function () {
    SFX.init(); SFX.click();
    ov('ovTitle', false);
    G.status = 'aim';
    showHint(G.stageIndex === 0);
  });
  document.getElementById('btnNext').addEventListener('click', function () { SFX.click(); nextStage(); });
  document.getElementById('btnRetry').addEventListener('click', function () { retryStage(); });
  document.getElementById('btnRetry2').addEventListener('click', function () { retryStage(); });
  document.getElementById('btnAgain').addEventListener('click', function () { SFX.click(); resetAll(); });

  var soundBtn = document.getElementById('btnSound');
  function applyMute(m) {
    SFX.setMuted(m);
    soundBtn.classList.toggle('off', m);
    soundBtn.textContent = m ? '✕' : '♪';
    try { localStorage.setItem('angrypick.muted', m ? '1' : '0'); } catch (err) { }
  }
  soundBtn.addEventListener('click', function () {
    SFX.init();
    applyMute(!SFX.isMuted());
  });
  try {
    if (localStorage.getItem('angrypick.muted') === '1') applyMute(true);
  } catch (err) { }

  /* ---------------- update ---------------- */
  function update(dt) {
    G.t += dt;

    /* wind */
    if (G.stage && G.stage.windAmp && G.status !== 'fly') {
      G.wind = Math.sin(G.t * (TAU / 7)) * G.stage.windAmp;
      G.stage.wind = G.wind;
    } else if (G.stage && !G.stage.windAmp) {
      G.stage.wind = 0;
    }

    if (G.status === 'fly' && G.pick) {
      var ev = MODEL.stepPick(G.pick, dt, G.env, G.stage);
      /* trail */
      G.trail.push({ x: G.pick.x, y: G.pick.y, a: G.pick.angle });
      if (G.trail.length > 14) G.trail.shift();

      if (ev.bounce) {
        var sp = ev.bounce.speed;
        if (sp > 60) {
          SFX.thud(sp, ev.bounce.kind);
          spark(ev.bounce.x, ev.bounce.y, Math.min(12, 3 + sp / 90), '255,230,200', sp * 0.45);
          G.shake = Math.min(Sf(0.012), G.shake + sp / G.env.vmax * Sf(0.010));
        }
      }
      if (ev.goal) onWin();
      else if (ev.dead) onMiss();
    }

    /* score display tween */
    if (G.shownScore !== G.score) {
      var diff = G.score - G.shownScore;
      G.shownScore += Math.sign(diff) * Math.min(Math.abs(diff), Math.max(1, Math.abs(diff) * dt * 5));
      if (Math.abs(G.score - G.shownScore) < 1) G.shownScore = G.score;
      updateHUD();
    }

    if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * Sf(0.05));
    if (G.recoil > 0) G.recoil = Math.max(0, G.recoil - dt * 3.2);
    if (G.release) {
      G.release.t += dt;
      if (G.release.t > 0.20) G.release = null;
    }
    updateParticles(dt);
  }

  /* ---------------- render ---------------- */
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var sh = G.shake;
    if (sh > 0.01) {
      ctx.translate(rand(-sh, sh), rand(-sh, sh));
    }

    if (bg.width) ctx.drawImage(bg, 0, 0, W, H);

    drawLights(G.t);
    drawGoalGlow(G.t);
    drawWind();
    drawCharacter(G.t);
    drawRelease();

    /* pick trail */
    if (G.status === 'fly') {
      for (var i = 0; i < G.trail.length; i++) {
        var tr = G.trail[i];
        var a = (i / G.trail.length) * 0.35;
        drawPickShape(ctx, tr.x, tr.y, G.env.pickR * (0.6 + 0.4 * i / G.trail.length), tr.a, a, false);
      }
    }

    /* band + preview */
    if (G.status === 'aim' && G.pick) {
      if (G.drag) {
        var d = G.drag;
        var len = Math.hypot(d.pull.x, d.pull.y);
        var strength = Math.min(1, len / G.env.maxDrag);
        drawPreview(-d.pull.x * G.env.k, -d.pull.y * G.env.k);
        drawBand(G.stage.anchor.x, G.stage.anchor.y, G.pick.x, G.pick.y, strength);
      }
      if (G.drag) {
        var pw = Math.min(1, Math.hypot(G.drag.pull.x, G.drag.pull.y) / G.env.maxDrag);
        var pr = G.env.pickR * 2.4;
        ctx.save();
        ctx.lineWidth = Math.max(2, Sf(0.006));
        ctx.strokeStyle = 'rgba(255,255,255,0.16)';
        ctx.beginPath(); ctx.arc(G.pick.x, G.pick.y, pr, 0, TAU); ctx.stroke();
        ctx.strokeStyle = pw > 0.86 ? 'rgba(255,120,150,0.95)' : 'rgba(150,245,255,0.9)';
        ctx.shadowColor = pw > 0.86 ? 'rgba(255,90,140,0.8)' : 'rgba(120,230,255,0.8)';
        ctx.shadowBlur = Sf(0.02);
        ctx.beginPath();
        ctx.arc(G.pick.x, G.pick.y, pr, -Math.PI / 2, -Math.PI / 2 + TAU * pw);
        ctx.stroke();
        ctx.restore();
      }
      var bobY = Math.sin(G.t * 1.5) * Sf(0.006);
      drawPickShape(ctx, G.pick.x, G.pick.y + (G.drag ? 0 : bobY),
        G.env.pickR * (G.drag ? 1 : (1 + Math.sin(G.t * 3) * 0.04)),
        G.pick.angle + (G.drag ? 0 : Math.sin(G.t * 2) * 0.25), 1, true);
    } else if (G.status === 'fly' && G.pick) {
      drawPickShape(ctx, G.pick.x, G.pick.y, G.env.pickR, G.pick.angle, 1, true);
    } else if ((G.status === 'win' || G.status === 'fail') && G.pick) {
      drawPickShape(ctx, G.pick.x, G.pick.y, G.env.pickR, G.pick.angle, 1, true);
    }

    drawParticles();

    /* top/bottom soft gradient for UI legibility */
    var top = ctx.createLinearGradient(0, 0, 0, Sf(0.22));
    top.addColorStop(0, 'rgba(0,0,0,0.35)');
    top.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = top;
    ctx.fillRect(0, 0, W, Sf(0.22));

    var bot = ctx.createLinearGradient(0, H - Sf(0.16), 0, H);
    bot.addColorStop(0, 'rgba(0,0,0,0)');
    bot.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = bot;
    ctx.fillRect(0, H - Sf(0.16), W, Sf(0.16));
  }

  /* ---------------- loop ---------------- */
  var last = 0;
  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(0.034, (now - last) / 1000);
    last = now;
    if (dt > 0) {
      update(dt);
      render();
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    clearTimeout(window.__rt);
    window.__rt = setTimeout(resize, 120);
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 260);
  });
  document.addEventListener('visibilitychange', function () { last = 0; });

  /* ---------------- boot ---------------- */
  resize();
  loadStage(0);
  ov('ovTitle', true);
  G.status = 'title';
  requestAnimationFrame(frame);

  /* debug handle (used by automated checks) */
  window.__pickGame = {
    G: G,
    launchAngle: function (deg, power) {
      if (G.status !== 'aim') return 'not-aiming';
      var env = G.env;
      var a = deg * Math.PI / 180;
      var spd = (power || 1) * env.vmax;
      G.pick = MODEL.makePick(env, G.stage, Math.cos(a) * spd, Math.sin(a) * spd);
      G.pick.spin = 16;
      G.status = 'fly';
      G.drag = null;
      return 'ok';
    },
    simulate: function (deg, power) {
      var env = G.env;
      var a = deg * Math.PI / 180;
      var spd = (power || 1) * env.vmax;
      return MODEL.simulate(G.stage, env, Math.cos(a) * spd, Math.sin(a) * spd, 7);
    }
  };
})();
</script>
</body>
</html>
